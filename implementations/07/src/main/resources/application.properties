spring.application.name=payment-service
server.port=${PORT:8080}
server.forward-headers-strategy=none
server.tomcat.connection-timeout=5s
server.tomcat.max-swallow-size=64KB
server.tomcat.max-http-form-post-size=64KB
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/payments}
spring.datasource.username=${DATABASE_USERNAME:payments}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.connection-init-sql=SET statement_timeout='5s'
spring.jdbc.template.query-timeout=5s
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
payments.maximum=${PAYMENT_MAXIMUM:10000.000}
payments.future-seconds=${PAYMENT_FUTURE_SECONDS:300}
payments.age-seconds=${PAYMENT_AGE_SECONDS:2592000}
payments.max-body-bytes=${MAX_BODY_BYTES:65536}
payments.db-attempts=${DB_ATTEMPTS:3}
payments.require-https=${REQUIRE_HTTPS:true}
payments.rate-per-minute=${RATE_PER_MINUTE:6000}
payments.trust-correlation-header=${TRUST_CORRELATION_HEADER:false}
payments.jwt.issuer=${JWT_ISSUER:https://identity.example.invalid/realms/payments}
payments.jwt.jwk-set-uri=${JWT_JWK_SET_URI:https://identity.example.invalid/realms/payments/protocol/openid-connect/certs}
payments.jwt.audience=${JWT_AUDIENCE:payment-service}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.tracing.sampling.probability=${TRACE_SAMPLE_RATE:0.1}
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=logstash
server.error.include-message=never
server.error.include-stacktrace=never
