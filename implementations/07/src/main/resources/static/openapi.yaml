  "components": {
    "securitySchemes": {
      "oauth2": {
        "type": "oauth2",
        "flows": {
          "clientCredentials": {
            "tokenUrl": "https://identity.example.invalid/oauth/token",
            "scopes": {
              "payments:write": "Submit permitted payments",
              "payments:read": "Read authorized receipts and balances",
              "payments:admin": "Run operational reconciliation and metrics"
            }
          }
        }
      }
    },
    "schemas": {
      "PaymentInstruction": {
        "type": "object",
        "additionalProperties": false,
        "xml": {
          "name": "payment"
        },
        "required": [
          "paymentId",
          "fromAccount",
          "toAccount",
          "amount",
          "date",
          "purpose"
        ],
        "properties": {
          "paymentId": {
            "type": "string",
            "format": "uuid"
          },
          "fromAccount": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
          },
          "toAccount": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
          },
          "amount": {
            "description": "Positive JOD decimal; at most three fractional digits, default maximum 10000.000. Numeric exponent notation is rejected.",
            "oneOf": [
              {
                "type": "number",
                "minimum": 0,
                "exclusiveMinimum": true,
                "maximum": 10000,
                "multipleOf": 0.001
              },
              {
                "type": "string",
                "pattern": "^(0|[1-9][0-9]*)(\\.[0-9]{1,3})?$"
              }
            ]
          },
          "date": {
            "type": "string",
            "format": "date-time",
            "description": "Offset required; default window: past 30 days through future 5 minutes"
          },
          "purpose": {
            "type": "string",
            "minLength": 1,
            "maxLength": 255,
            "description": "Required nonblank text, trimmed"
          },
          "notes": {
            "type": "string",
            "maxLength": 1000,
            "description": "Optional trimmed text; empty allowed, explicit null rejected"
          }
        }
      },
      "Receipt": {
        "type": "object",
        "xml": {
          "name": "receipt"
        },
        "required": [
          "paymentId",
          "status",
          "fromAccount",
          "toAccount",
          "amount",
          "currency",
          "processedAt"
        ],
        "properties": {
          "paymentId": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "type": "string",
            "enum": [
              "COMPLETED"
            ]
          },
          "fromAccount": {
            "type": "string"
          },
          "toAccount": {
            "type": "string"
          },
          "amount": {
            "type": "string",
            "pattern": "^[0-9]+\\.[0-9]{3}$"
          },
          "currency": {
            "type": "string",
            "enum": [
              "JOD"
            ]
          },
          "processedAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Issue": {
        "type": "object",
        "properties": {
          "field": {
            "type": "string"
          },
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          }
        }
      },
      "Error": {
        "type": "object",
        "xml": {
          "name": "error"
        },
        "required": [
          "status",
          "code",
          "message",
          "issues",
          "correlationId",
          "timestamp"
        ],
        "properties": {
          "paymentId": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "type": "string",
            "enum": [
              "ERROR",
              "REJECTED"
            ]
          },
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "issues": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Issue"
            },
            "xml": {
              "wrapped": true
            }
          },
          "correlationId": {
            "type": "string"
          },
          "timestamp": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Balance": {
        "type": "object",
        "xml": {
          "name": "balance"
        },
        "properties": {
          "accountId": {
            "type": "string"
          },
          "balance": {
            "type": "string",
            "pattern": "^[0-9]+\\.[0-9]{3}$"
          },
          "currency": {
            "type": "string",
            "enum": [
              "JOD"
            ]
          }
        }
      },
      "Reconciliation": {
        "type": "object",
        "xml": {
          "name": "reconciliation"
        },
        "properties": {
          "consistent": {
            "type": "boolean"
          },
          "issues": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "kind": {
                  "type": "string",
                  "enum": [
                    "PAYMENT_LEDGER",
                    "ACCOUNT_BALANCE",
                    "LEDGER_SNAPSHOT"
                  ]
                },
                "reference": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    }
  }
}
