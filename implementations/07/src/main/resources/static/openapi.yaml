        "operationId": "submitPayment",
        "summary": "Atomically transfer JOD between internal accounts",
        "description": "The caller must own or be explicitly authorized to debit the source; destination must permit receipt. Duplicate properties/elements, coercion and unsafe XML are rejected. The body is bounded to 64 KiB by default. Rejections are durable and corrected instructions require a new payment ID. Identical normalized payload replay returns the original outcome.",
