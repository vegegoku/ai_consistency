quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/payments}
quarkus.datasource.username=${DATABASE_USER:payments_app}
quarkus.datasource.password=${DATABASE_PASSWORD:}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=24
quarkus.datasource.jdbc.acquisition-timeout=3S
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=3
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=10
quarkus.datasource.jdbc.transactions=disabled
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-disabled=true
quarkus.http.limits.max-body-size=${PAYMENT_MAX_BODY:65536}
quarkus.http.idle-timeout=30S
quarkus.http.read-timeout=10S
quarkus.log.console.json=true
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${OIDC_URL:https://identity.example.invalid/realms/payments}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:payment-service}
quarkus.oidc.token.audience=${OIDC_AUDIENCE:payment-service}
quarkus.oidc.token.principal-claim=sub
quarkus.oidc.roles.role-claim-path=scope
quarkus.oidc.discovery-enabled=true
quarkus.oidc.authentication.user-info-required=false
quarkus.oidc.token.signature-algorithm=RS256
quarkus.keycloak.devservices.enabled=false
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=false
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
payment.max-body=${PAYMENT_MAX_BODY:65536}
payment.max-amount=${PAYMENT_MAX_AMOUNT:10000.000}
payment.max-age=${PAYMENT_MAX_AGE:P30D}
payment.max-future=${PAYMENT_MAX_FUTURE:PT5M}
payment.db-attempts=${PAYMENT_DB_ATTEMPTS:3}
payment.lock-timeout-ms=${PAYMENT_LOCK_TIMEOUT_MS:2000}
payment.statement-timeout-ms=${PAYMENT_STATEMENT_TIMEOUT_MS:5000}
payment.rate-per-minute=${PAYMENT_RATE_PER_MINUTE:6000}
payment.require-tls=true
payment.trust-correlation-header=false
payment.retention-days=${PAYMENT_RETENTION_DAYS:2555}
%prod.quarkus.http.insecure-requests=disabled
%dev.payment.require-tls=false
%dev.quarkus.datasource.username=payments_dev
%dev.quarkus.datasource.password=local-development-only
%dev.quarkus.otel.sdk.disabled=true
%test.payment.require-tls=false
%test.quarkus.otel.sdk.disabled=true
%dev.quarkus.flyway.locations=db/migration,db/devmigration
quarkus.flyway.username=${DATABASE_MIGRATION_USER:${quarkus.datasource.username}}
quarkus.flyway.password=${DATABASE_MIGRATION_PASSWORD:${quarkus.datasource.password}}
quarkus.log.console.json.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
quarkus.log.console.json.zone-id=UTC
%test.quarkus.http.test-port=0
mp.openapi.scan.disable=true
