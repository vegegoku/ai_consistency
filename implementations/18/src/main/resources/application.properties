quarkus.application.name=payment-service-18
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/payments}
quarkus.datasource.username=${DB_USER:payments}
quarkus.datasource.password=${DB_PASSWORD:change-me-local-only}
quarkus.datasource.jdbc.transactions=disabled
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=24
quarkus.datasource.jdbc.acquisition-timeout=3S
quarkus.datasource.jdbc.background-validation-interval=30S
quarkus.datasource.metrics.enabled=true
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-disabled=true
quarkus.http.limits.max-body-size=64K
quarkus.http.limits.max-header-size=16K
quarkus.http.idle-timeout=30S
%prod.quarkus.http.insecure-requests=disabled
quarkus.http.ssl.certificate.files=${TLS_CERT:}
quarkus.http.ssl.certificate.key-files=${TLS_KEY:}
mp.jwt.verify.issuer=${JWT_ISSUER:https://identity.example.invalid/realms/payments}
mp.jwt.verify.audiences=${JWT_AUDIENCE:payment-service}
mp.jwt.verify.publickey.location=${JWT_JWKS_URL:https://identity.example.invalid/realms/payments/protocol/openid-connect/certs}
mp.jwt.verify.required.claims=exp,iat,sub,aud,iss
smallrye.jwt.time-to-live=3600
smallrye.jwt.clock.skew=0
quarkus.log.console.json=true
quarkus.log.console.json.exception-output-type=formatted
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.traces.sampler.arg=${TRACE_SAMPLE_RATIO:0.1}
payments.maximum=${PAYMENT_MAXIMUM:10000.000}
payments.future-seconds=${PAYMENT_FUTURE_SECONDS:300}
payments.old-days=${PAYMENT_OLD_DAYS:30}
payments.body-limit=${PAYMENT_BODY_LIMIT:65536}
payments.rate-per-minute=${PAYMENT_RATE_PER_MINUTE:6000}
payments.lock-timeout-ms=${PAYMENT_LOCK_TIMEOUT_MS:2000}
payments.statement-timeout-ms=${PAYMENT_STATEMENT_TIMEOUT_MS:5000}
payments.retries=${PAYMENT_RETRIES:2}
payments.audit-retention-days=${AUDIT_RETENTION_DAYS:2555}
%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.mp.jwt.verify.issuer=https://test-issuer.example
%test.quarkus.otel.enabled=false
%test.quarkus.log.console.json=false
%test.quarkus.http.ssl.certificate.files=
%test.quarkus.http.ssl.certificate.key-files=
quarkus.http.auth.proactive=false
%test.quarkus.http.test-port=0
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=3
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=10
quarkus.datasource.jdbc.additional-jdbc-properties.tcpKeepAlive=true
mp.jwt.verify.publickey.algorithm=RS256
quarkus.datasource.jdbc.additional-jdbc-properties.options=-c statement_timeout=${PAYMENT_STATEMENT_TIMEOUT_MS:5000} -c lock_timeout=${PAYMENT_LOCK_TIMEOUT_MS:2000} -c timezone=UTC
