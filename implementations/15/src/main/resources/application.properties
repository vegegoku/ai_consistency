spring.application.name=payment-service
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payments}
spring.datasource.username=${DB_USER:payments}
spring.datasource.password=${DB_PASSWORD:payments-local-only}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.data-source-properties.options=-c statement_timeout=5000 -c lock_timeout=2000 -c timezone=UTC
spring.flyway.enabled=true
spring.flyway.user=${MIGRATION_USER:${DB_USER:payments}}
spring.flyway.password=${MIGRATION_PASSWORD:${DB_PASSWORD:payments-local-only}}
spring.jackson.default-property-inclusion=non_null
server.port=${PORT:8080}
server.max-http-request-header-size=16KB
server.tomcat.connection-timeout=5s
server.tomcat.max-swallow-size=64KB
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
payments.require-https=${REQUIRE_HTTPS:true}
payments.max-body-bytes=${MAX_BODY_BYTES:65536}
payments.max-amount=${MAX_PAYMENT_AMOUNT:10000.000}
payments.future-seconds=${MAX_FUTURE_SECONDS:300}
payments.past-seconds=${MAX_AGE_SECONDS:2592000}
payments.rate-limit=${RATE_LIMIT_PER_MINUTE:600}
payments.max-retries=${DB_MAX_RETRIES:2}
payments.financial-retention-years=${FINANCIAL_RETENTION_YEARS:7}
payments.issue-retention-days=${ISSUE_RETENTION_DAYS:90}
payments.jwt.issuer=${JWT_ISSUER:http://localhost:8180/realms/payments}
payments.jwt.jwk-set-uri=${JWT_JWKS_URI:http://localhost:8180/realms/payments/protocol/openid-connect/certs}
payments.jwt.audience=${JWT_AUDIENCE:payments-api}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:0.1}
management.otlp.tracing.export.enabled=${OTEL_EXPORT_ENABLED:false}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=logstash
logging.level.org.springframework.web=INFO
