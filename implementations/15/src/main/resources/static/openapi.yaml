  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "Payment": {
        "type": "object",
        "xml": {
          "name": "payment"
        },
        "additionalProperties": false,
        "required": [
          "paymentId",
          "fromAccount",
          "toAccount",
          "amount",
          "date",
          "purpose"
        ],
        "properties": {
          "paymentId": {
            "type": "string",
            "format": "uuid",
            "description": "Canonical lowercase UUID; not trimmed"
          },
          "fromAccount": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "toAccount": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "amount": {
            "oneOf": [
              {
                "type": "number",
                "minimum": 0,
                "exclusiveMinimum": true,
                "maximum": 10000,
                "multipleOf": 0.001
              },
              {
                "type": "string",
                "pattern": "^\\d+(\\.\\d{1,3})?$"
              }
            ],
            "description": "Parsed as BigDecimal. Decimal string or number; ordinary decimal notation, no exponent; no rounding."
          },
          "date": {
            "type": "string",
            "format": "date-time",
            "description": "Explicit UTC offset required; maximum 5 minutes future / 30 days old by default."
          },
          "purpose": {
            "type": "string",
            "minLength": 1,
            "maxLength": 255,
            "description": "Trimmed before fingerprinting."
          },
          "notes": {
            "type": "string",
            "maxLength": 1000,
            "description": "Trimmed; absent/null and empty canonicalize to empty."
          }
        }
      },
      "Receipt": {
        "type": "object",
        "xml": {
          "name": "response"
        },
        "required": [
          "paymentId",
          "status",
          "fromAccount",
          "toAccount",
          "amount",
          "currency",
          "processedAt"
        ],
        "properties": {
          "paymentId": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "type": "string",
            "enum": [
              "COMPLETED"
            ]
          },
          "fromAccount": {
            "type": "string"
          },
          "toAccount": {
            "type": "string"
          },
          "amount": {
            "type": "string",
            "pattern": "^\\d+\\.\\d{3}$"
          },
          "currency": {
            "type": "string",
            "enum": [
              "JOD"
            ]
          },
          "processedAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Error": {
        "type": "object",
        "xml": {
          "name": "response"
        },
        "required": [
          "status",
          "code",
          "message",
          "issues",
          "correlationId",
          "timestamp"
        ],
        "properties": {
          "paymentId": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "type": "string",
            "enum": [
              "ERROR",
              "REJECTED"
            ]
          },
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "issues": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "field",
                "code",
                "message"
              ],
              "properties": {
                "field": {
                  "type": "string"
                },
                "code": {
                  "type": "string"
                },
                "message": {
                  "type": "string"
                }
              }
            }
          },
          "correlationId": {
            "type": "string",
            "format": "uuid"
          },
          "timestamp": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Balance": {
        "type": "object",
        "properties": {
          "accountId": {
            "type": "string"
          },
          "availableBalance": {
            "type": "string",
            "pattern": "^\\d+\\.\\d{3}$"
          },
          "currency": {
            "type": "string",
            "enum": [
              "JOD"
            ]
          }
        }
      },
      "Reconciliation": {
        "type": "object",
        "properties": {
          "healthy": {
            "type": "boolean"
          },
          "paymentAnomalies": {
            "type": "array",
            "items": {
              "type": "object"
            }
          },
          "balanceAnomalies": {
            "type": "array",
            "items": {
              "type": "object"
            }
          },
          "checkedAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      }
    }
  }
}
