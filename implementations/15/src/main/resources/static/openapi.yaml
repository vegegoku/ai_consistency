{
  "openapi": "3.0.3",
  "info": {
    "title": "Internal JOD Payment Service",
    "version": "1.0.0",
    "description": "All responses support JSON or XML. Correlation IDs are generated per request; no public header is trusted. TLS and OIDC are required in production."
  },
  "servers": [
    {
      "url": "https://payments.example.test"
    }
  ],
