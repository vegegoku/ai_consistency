quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:payments}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/payments?connectTimeout=3&socketTimeout=10&options=-c%20statement_timeout=5000}
quarkus.datasource.jdbc.max-size=32
quarkus.datasource.jdbc.transaction-isolation-level=read-committed
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=3
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=10
quarkus.datasource.jdbc.additional-jdbc-properties.tcpKeepAlive=true
quarkus.datasource.jdbc.acquisition-timeout=3S
quarkus.datasource.jdbc.new-connection-sql=SET statement_timeout TO ${PAYMENT_STATEMENT_MS:5000}; SET lock_timeout TO ${PAYMENT_LOCK_MS:2000}
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.http.limits.max-body-size=${payment.body-bytes}
quarkus.http.idle-timeout=20S
quarkus.http.http2=false
quarkus.http.auth.proactive=false
quarkus.http.insecure-requests=disabled
%dev.quarkus.http.insecure-requests=enabled
%test.quarkus.http.insecure-requests=enabled
%dev.payment.require-tls=false
%test.payment.require-tls=false
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY}
mp.jwt.verify.issuer=${JWT_ISSUER}
mp.jwt.verify.audiences=${JWT_AUDIENCE:payments-api}
mp.jwt.verify.clock.skew=0
smallrye.jwt.required.claims=sub,exp,iat,iss,aud
mp.jwt.verify.publickey.algorithm=RS256
quarkus.log.console.json=true
quarkus.log.console.json.additional-field.service.value=payment-service
quarkus.otel.service.name=payment-service
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_ENDPOINT:http://localhost:4317}
%test.quarkus.otel.sdk.disabled=true
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=false
payment.maximum=${PAYMENT_MAXIMUM:10000.000}
payment.future-seconds=${PAYMENT_FUTURE_SECONDS:300}
payment.age-seconds=${PAYMENT_AGE_SECONDS:2592000}
payment.body-bytes=${PAYMENT_BODY_BYTES:65536}
payment.rate-per-minute=${PAYMENT_RATE_PER_MINUTE:600}
payment.db-lock-ms=${PAYMENT_LOCK_MS:2000}
payment.db-statement-ms=${PAYMENT_STATEMENT_MS:5000}
payment.retries=${PAYMENT_RETRIES:2}
payment.require-tls=${PAYMENT_REQUIRE_TLS:true}
payment.audit-retention-days=${AUDIT_RETENTION_DAYS:2555}
