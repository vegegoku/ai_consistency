quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:payments}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/payments?connectTimeout=3&socketTimeout=10}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.http.limits.max-body-size=1M
quarkus.http.read-timeout=10S
quarkus.http.idle-timeout=30S
quarkus.http.auth.proactive=false
quarkus.http.insecure-requests=disabled
%dev.quarkus.http.insecure-requests=enabled
%test.quarkus.http.insecure-requests=enabled
quarkus.log.console.json=true
quarkus.log.console.json.exception-output-type=formatted
mp.jwt.verify.issuer=${JWT_ISSUER:https://identity.example.invalid/realms/payments}
mp.jwt.verify.audiences=${JWT_AUDIENCE:payments-api}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY:publicKey.pem}
smallrye.jwt.required.claims=sub,exp,iat,iss,aud
mp.jwt.verify.publickey.algorithm=RS256
quarkus.otel.enabled=true
quarkus.otel.exporter.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
quarkus.smallrye-openapi.info-title=Payment Processing API
quarkus.smallrye-openapi.info-version=1.0.0


quarkus.datasource.jdbc.additional-jdbc-properties.options=-c statement_timeout=5000 -c lock_timeout=2000
