quarkus.http.insecure-requests=enabled
payments.require-tls=false
quarkus.datasource.password=unused
mp.jwt.verify.issuer=https://test-issuer.example
mp.jwt.verify.audiences=payments-api
mp.jwt.verify.publickey.location=public-key.pem
quarkus.otel.sdk.disabled=true
quarkus.log.console.json.enabled=false
payments.rate-per-minute=200
payments.lock-timeout-ms=200
payments.transient-retries=1
smallrye.jwt.sign.key.location=private-key.pem
quarkus.http.test-port=0
