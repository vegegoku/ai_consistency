quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:payments}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/payments}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.acquisition-timeout=3S
quarkus.datasource.jdbc.login-timeout=3S
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=3
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=10
quarkus.datasource.jdbc.additional-jdbc-properties.options=-c statement_timeout=${payments.statement-timeout-ms:5000} -c lock_timeout=${payments.lock-timeout-ms:1000} -c timezone=UTC
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-disabled=true
quarkus.http.limits.max-body-size=65K
quarkus.http.idle-timeout=30S
quarkus.http.read-timeout=30S
quarkus.http.limits.max-connections=1000
quarkus.http.auth.proactive=false
quarkus.http.insecure-requests=disabled
quarkus.log.console.json.enabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT:http://localhost:4317}
quarkus.otel.metrics.enabled=false
quarkus.smallrye-openapi.info-title=Payment Processing API
quarkus.smallrye-openapi.info-version=1.0.0
mp.jwt.verify.issuer=${JWT_ISSUER}
mp.jwt.verify.audiences=${JWT_AUDIENCE:payments-api}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
mp.jwt.verify.publickey.algorithm=RS256
smallrye.jwt.required.claims=iss,sub,aud,exp,iat
smallrye.jwt.expiration.grace=0
payments.require-tls=true
payments.max-body-bytes=65536
payments.max-amount=10000.000
payments.max-age-days=30
payments.future-seconds=300
payments.lock-timeout-ms=1000
payments.statement-timeout-ms=5000
payments.transient-retries=2
payments.rate-per-minute=600
payments.rate-max-principals=10000
payments.retention-years=7
%dev.quarkus.http.insecure-requests=enabled
%dev.payments.require-tls=false
%dev.quarkus.datasource.password=local-only-payments
%dev.mp.jwt.verify.issuer=http://localhost:8080/local-issuer
%dev.mp.jwt.verify.publickey.location=dev/public-key.pem
%dev.quarkus.otel.sdk.disabled=true
