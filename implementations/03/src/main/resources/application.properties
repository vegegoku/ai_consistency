quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:payments}
quarkus.datasource.password=${DB_PASSWORD:local-only-password}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/payments?connectTimeout=5&socketTimeout=10}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.flyway.migrate-at-start=true
quarkus.http.limits.max-body-size=64K
quarkus.http.read-timeout=10S
quarkus.http.auth.proactive=false
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY:publicKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:https://issuer.example.test}
mp.jwt.verify.audiences=${JWT_AUDIENCE:payments}
smallrye.jwt.required.claims=sub,exp,iat,iss,aud
quarkus.log.console.json=true
quarkus.otel.sdk.disabled=${OTEL_DISABLED:true}
quarkus.smallrye-openapi.path=/q/openapi
payments.require-https=${REQUIRE_HTTPS:true}
payments.maximum=${PAYMENT_MAXIMUM:10000}
payments.max-body-bytes=${MAX_BODY_BYTES:65536}
payments.future-seconds=${MAX_FUTURE_SECONDS:300}
payments.max-age-seconds=${MAX_AGE_SECONDS:2592000}
payments.requests-per-minute=${REQUESTS_PER_MINUTE:600}
%dev.payments.require-https=false
%test.payments.require-https=false
%test.quarkus.log.console.json=false

payments.audit-retention-days=${AUDIT_RETENTION_DAYS:2555}
payments.log-retention-days=${LOG_RETENTION_DAYS:90}
%test.payments.requests-per-minute=20
