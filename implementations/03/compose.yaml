services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: local-only-password
    ports: ["5432:5432"]
    volumes: ["payment-data:/var/lib/postgresql/data", "./dev/seed.sql:/docker-entrypoint-initdb.d/99-seed.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  payment-data:
