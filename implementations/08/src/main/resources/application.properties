quarkus.application.name=payment-service
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/payments}
quarkus.datasource.username=${DATABASE_USER:payments_app}
quarkus.datasource.password=${DATABASE_PASSWORD:}
quarkus.datasource.jdbc.transactions=disabled
quarkus.datasource.jdbc.max-size=24
quarkus.datasource.jdbc.acquisition-timeout=3S
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=3
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=10
quarkus.datasource.jdbc.additional-jdbc-properties.options=-c statement_timeout=5000
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-disabled=true
# Body limits are enforced before REST for known length and by bounded InputStream reads for chunked input.
quarkus.http.limits.max-body-size=
quarkus.http.read-timeout=10S
quarkus.http.insecure-requests=disabled
quarkus.http.ssl.certificate.files=${TLS_CERT_FILE:}
quarkus.http.ssl.certificate.key-files=${TLS_KEY_FILE:}
quarkus.http.proxy.proxy-address-forwarding=false
quarkus.log.console.json=true
quarkus.log.category."io.smallrye.jwt".level=WARN
quarkus.log.category."org.postgresql".level=WARN
quarkus.log.category."org.flywaydb".level=WARN
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_ENDPOINT:http://localhost:4317}
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=0.1
quarkus.smallrye-openapi.path=/q/openapi
mp.jwt.verify.issuer=${JWT_ISSUER:https://identity.example.invalid}
mp.jwt.verify.audiences=${JWT_AUDIENCE:payment-service}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:}
smallrye.jwt.required.claims=sub,exp,iat
smallrye.jwt.time-to-live=900
payments.max-amount=${PAYMENT_MAX_AMOUNT:10000.000}
payments.max-age-seconds=${PAYMENT_MAX_AGE_SECONDS:2592000}
payments.max-future-seconds=${PAYMENT_MAX_FUTURE_SECONDS:300}
payments.body-limit=${PAYMENT_BODY_LIMIT:65536}
payments.rate-limit-per-minute=${PAYMENT_RATE_LIMIT_PER_MINUTE:6000}
payments.retention-years=${PAYMENT_RETENTION_YEARS:7}
%dev.quarkus.http.insecure-requests=enabled
%dev.quarkus.http.ssl.certificate.files=
%dev.quarkus.http.ssl.certificate.key-files=
%dev.quarkus.flyway.locations=db/migration,db/dev
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.http.insecure-requests=enabled
%test.quarkus.http.ssl.certificate.files=
%test.quarkus.http.ssl.certificate.key-files=
%test.quarkus.otel.sdk.disabled=true
%test.mp.jwt.verify.issuer=https://test.example
%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.mp.jwt.verify.audiences=payment-service
%test.quarkus.log.console.json=false
quarkus.http.auth.proactive=false
mp.jwt.verify.publickey.algorithm=RS256
%test.quarkus.http.test-port=0
