openapi: 3.0.3
info:
  title: JOD Payment Processing API
  version: 1.0.0
  description: Atomic internal transfers with strict JSON/XML contracts. XML responses
    use a response root. All calls require TLS in production. Error response formats
    follow Accept. Authentication scopes are stated per operation.
paths:
  /api/v1/payments:
    post:
      operationId: submitPayment
      summary: Atomically transfer JOD; requires payments:write
      description: Unique UUID guarantees exactly one financial effect. Canonical
        same-payload retry returns the original receipt with 200, even after timestamp
        expiry. Different content returns 409. Durable business rejections replay
        their original HTTP status and body. Nonexistent/prohibited destination is
        generic FORBIDDEN. Financial effects commit before response.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInstruction'
            example:
              paymentId: d92192df-f79a-4553-8120-5660d2eb1294
              fromAccount: ACC-1001
              toAccount: ACC-2002
              amount: '125.750'
              date: '2026-10-28T13:30:00+03:00'
              purpose: Invoice INV-2048
              notes: October services
          application/xml:
            schema:
              $ref: '#/components/schemas/PaymentInstruction'
            example: <payment><paymentId>d92192df-f79a-4553-8120-5660d2eb1294</paymentId><fromAccount>ACC-1001</fromAccount><toAccount>ACC-2002</toAccount><amount>125.750</amount><date>2026-10-28T13:30:00+03:00</date><purpose>Invoice
              INV-2048</purpose><notes>October services</notes></payment>
      responses:
        '201':
          description: First successful transfer committed.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema: &id001
                $ref: '#/components/schemas/Receipt'
              example: &id002
                paymentId: d92192df-f79a-4553-8120-5660d2eb1294
                status: COMPLETED
                fromAccount: ACC-1001
                toAccount: ACC-2002
                amount: '125.750'
                currency: JOD
                processedAt: '2026-10-28T10:30:01Z'
            application/xml:
              schema: *id001
              example: *id002
        '200':
          description: Idempotent replay of committed transfer.
          content:
            application/json:
              schema: &id003
                $ref: '#/components/schemas/Receipt'
              example: *id002
            application/xml:
              schema: *id003
              example: *id002
        '400': &id027
          description: Malformed document or aggregated field validation issues; no
            funds moved.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema: &id004
                $ref: '#/components/schemas/Error'
              example: &id005
                status: ERROR
                code: VALIDATION_FAILED
                message: Malformed document or aggregated field validation issues;
                  no funds moved.
                issues: []
                correlationId: 84b2e7b7-df46-4a7e-aa50-87352a37fd4f
                timestamp: '2026-10-28T10:30:01Z'
            application/xml:
              schema: *id004
              example: *id005
        '401': &id028
          description: Missing or invalid RS256 bearer access token.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema: &id006
                $ref: '#/components/schemas/Error'
              example: &id007
                status: ERROR
                code: UNAUTHENTICATED
                message: Missing or invalid RS256 bearer access token.
                issues: []
                correlationId: 84b2e7b7-df46-4a7e-aa50-87352a37fd4f
                timestamp: '2026-10-28T10:30:01Z'
            application/xml:
              schema: *id006
              example: *id007
        '403': &id029
          description: Scope, debit permission or destination policy denied.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema: &id008
                $ref: '#/components/schemas/Error'
              example: &id009
                status: ERROR
                code: FORBIDDEN
                message: Scope, debit permission or destination policy denied.
                issues: []
                correlationId: 84b2e7b7-df46-4a7e-aa50-87352a37fd4f
                timestamp: '2026-10-28T10:30:01Z'
            application/xml:
              schema: *id008
              example: *id009
        '404': &id030
          description: Resource unknown or not visible to caller.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema: &id010
                $ref: '#/components/schemas/Error'
              example: &id011
                status: ERROR
                code: ACCOUNT_NOT_FOUND
                message: Resource unknown or not visible to caller.
                issues: []
                correlationId: 84b2e7b7-df46-4a7e-aa50-87352a37fd4f
                timestamp: '2026-10-28T10:30:01Z'
            application/xml:
              schema: *id010
              example: *id011
        '406': &id031
          description: Only application/json and application/xml are supported.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema: &id012
                $ref: '#/components/schemas/Error'
              example: &id013
                status: ERROR
                code: NOT_ACCEPTABLE
                message: Only application/json and application/xml are supported.
                issues: []
                correlationId: 84b2e7b7-df46-4a7e-aa50-87352a37fd4f
                timestamp: '2026-10-28T10:30:01Z'
            application/xml:
              schema: *id012
              example: *id013
        '409': &id032
          description: Conflicting identity, insufficient funds, inactive account
            or policy rejection.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema: &id014
                $ref: '#/components/schemas/Error'
              example: &id015
                status: ERROR
                code: IDEMPOTENCY_CONFLICT
                message: Conflicting identity, insufficient funds, inactive account
                  or policy rejection.
                issues: []
                correlationId: 84b2e7b7-df46-4a7e-aa50-87352a37fd4f
                timestamp: '2026-10-28T10:30:01Z'
            application/xml:
              schema: *id014
              example: *id015
        '413': &id033
          description: Configured request body limit exceeded.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema: &id016
                $ref: '#/components/schemas/Error'
              example: &id017
                status: ERROR
                code: REQUEST_TOO_LARGE
                message: Configured request body limit exceeded.
                issues: []
                correlationId: 84b2e7b7-df46-4a7e-aa50-87352a37fd4f
                timestamp: '2026-10-28T10:30:01Z'
            application/xml:
              schema: *id016
              example: *id017
        '415': &id034
          description: Use UTF-8 application/json or application/xml.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema: &id018
                $ref: '#/components/schemas/Error'
              example: &id019
                status: ERROR
                code: UNSUPPORTED_MEDIA_TYPE
                message: Use UTF-8 application/json or application/xml.
                issues: []
                correlationId: 84b2e7b7-df46-4a7e-aa50-87352a37fd4f
                timestamp: '2026-10-28T10:30:01Z'
            application/xml:
              schema: *id018
              example: *id019
        '429': &id035
          description: Shared per-principal minute limit exceeded.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema: &id020
                $ref: '#/components/schemas/Error'
              example: &id021
                status: ERROR
                code: RATE_LIMITED
                message: Shared per-principal minute limit exceeded.
                issues: []
                correlationId: 84b2e7b7-df46-4a7e-aa50-87352a37fd4f
                timestamp: '2026-10-28T10:30:01Z'
            application/xml:
              schema: *id020
              example: *id021
        '503': &id036
          description: Transient DB/lock failure. Query payment status or retry the
            same identity.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema: &id022
                $ref: '#/components/schemas/Error'
              example: &id023
                status: ERROR
                code: TEMPORARILY_UNAVAILABLE
                message: Transient DB/lock failure. Query payment status or retry
                  the same identity.
                issues: []
                correlationId: 84b2e7b7-df46-4a7e-aa50-87352a37fd4f
                timestamp: '2026-10-28T10:30:01Z'
            application/xml:
              schema: *id022
              example: *id023
        '500': &id037
          description: Unexpected server failure; do not assume a transfer did not
            commit.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema: &id024
                $ref: '#/components/schemas/Error'
              example: &id025
                status: ERROR
                code: INTERNAL_ERROR
                message: Unexpected server failure; do not assume a transfer did not
                  commit.
                issues: []
                correlationId: 84b2e7b7-df46-4a7e-aa50-87352a37fd4f
                timestamp: '2026-10-28T10:30:01Z'
            application/xml:
              schema: *id024
              example: *id025
  /api/v1/payments/{paymentId}:
    get:
      operationId: paymentStatus
      summary: Read persisted status; requires payments:read
      security:
      - bearerAuth: []
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Persisted completed or rejected payment outcome. Unknown and
            inaccessible IDs return identical 404.
          content:
            application/json:
              schema: &id026
                oneOf:
                - $ref: '#/components/schemas/Receipt'
                - $ref: '#/components/schemas/Error'
            application/xml:
              schema: *id026
        '400': *id027
        '401': *id028
        '403': *id029
        '404': *id030
        '406': *id031
        '409': *id032
        '413': *id033
        '415': *id034
        '429': *id035
        '503': *id036
        '500': *id037
  /api/v1/accounts/{accountId}/balance:
    get:
      operationId: accountBalance
      summary: Authorized available settled balance; requires balances:read
      security:
      - bearerAuth: []
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
      responses:
        '200':
          description: Current committed balance for caller-owned or explicitly authorized
            account.
          content:
            application/json:
              schema: &id038
                $ref: '#/components/schemas/Balance'
              example: &id039
                accountId: ACC-1001
                balance: '374.250'
                currency: JOD
            application/xml:
              schema: *id038
              example: *id039
        '400': *id027
        '401': *id028
        '403': *id029
        '404': *id030
        '406': *id031
        '409': *id032
        '413': *id033
        '415': *id034
        '429': *id035
        '503': *id036
        '500': *id037
  /api/v1/admin/reconciliation:
    get:
      operationId: reconciliation
      summary: Repeatable-read discrepancy report; requires payments:admin
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Report only; does not repair or alter any financial state.
          content:
            application/json:
              schema: &id040
                type: object
                properties:
                  consistent:
                    type: boolean
                  timestamp:
                    type: string
                    format: date-time
                  issues:
                    type: array
                    items:
                      type: object
            application/xml:
              schema: *id040
        '400': *id027
        '401': *id028
        '403': *id029
        '404': *id030
        '406': *id031
        '409': *id032
        '413': *id033
        '415': *id034
        '429': *id035
        '503': *id036
        '500': *id037
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PaymentInstruction:
      type: object
      additionalProperties: false
      xml:
        name: payment
      required:
      - paymentId
      - fromAccount
      - toAccount
      - amount
      - date
      - purpose
      properties:
        paymentId:
          type: string
          format: uuid
        fromAccount:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
        toAccount:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
        amount:
          oneOf:
          - type: string
            pattern: ^[0-9]+(\.[0-9]{1,3})?$
          - type: number
            minimum: 0
            exclusiveMinimum: true
            maximum: 10000
            multipleOf: 0.001
          description: Plain positive decimal; maximum configured default 10000.000;
            never rounded.
        date:
          type: string
          format: date-time
          description: Offset required, at most 30 days old and five minutes future
            on first submission.
        purpose:
          type: string
          minLength: 1
          maxLength: 255
        notes:
          type: string
          maxLength: 1000
    Receipt:
      type: object
      required:
      - paymentId
      - status
      - fromAccount
      - toAccount
      - amount
      - currency
      - processedAt
      properties:
        paymentId:
          type: string
        status:
          type: string
          enum:
          - COMPLETED
        fromAccount:
          type: string
        toAccount:
          type: string
        amount:
          type: string
          pattern: ^[0-9]+\.[0-9]{3}$
        currency:
          type: string
          enum:
          - JOD
        processedAt:
          type: string
          format: date-time
      xml:
        name: response
    Error:
      type: object
      required:
      - status
      - code
      - message
      - issues
      - correlationId
      - timestamp
      properties:
        paymentId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - ERROR
          - REJECTED
        code:
          type: string
          enum:
          - METHOD_NOT_ALLOWED
          - PAYMENT_LIMIT_EXCEEDED
          - ACCOUNT_NOT_FOUND
          - IDEMPOTENCY_CONFLICT
          - PAYMENT_NOT_FOUND
          - INSUFFICIENT_FUNDS
          - TEMPORARILY_UNAVAILABLE
          - RATE_LIMITED
          - ACCOUNT_NOT_ACTIVE
          - NOT_FOUND
          - REQUEST_TOO_LARGE
          - UNAUTHENTICATED
          - NOT_ACCEPTABLE
          - UNSUPPORTED_MEDIA_TYPE
          - FORBIDDEN
          - INTERNAL_ERROR
          - VALIDATION_FAILED
          - MALFORMED_MESSAGE
        message:
          type: string
        issues:
          type: array
          items:
            type: object
            required:
            - field
            - code
            - message
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
        correlationId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
      xml:
        name: response
    Balance:
      type: object
      properties:
        accountId:
          type: string
        balance:
          type: string
          pattern: ^[0-9]+\.[0-9]{3}$
        currency:
          type: string
          enum:
          - JOD
      xml:
        name: response
