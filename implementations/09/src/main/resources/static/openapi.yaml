{
  "openapi": "3.1.0",
  "info": {
    "title": "Payment Service",
    "version": "1.0.0",
    "description": "Fixed currency JOD. Input amount never rounded. All errors: MALFORMED_MESSAGE, VALIDATION_FAILED, UNAUTHENTICATED, FORBIDDEN, ACCOUNT_NOT_FOUND, PAYMENT_NOT_FOUND, ACCOUNT_NOT_ACTIVE, INSUFFICIENT_FUNDS, IDEMPOTENCY_CONFLICT, PAYMENT_LIMIT_EXCEEDED, UNSUPPORTED_MEDIA_TYPE, NOT_ACCEPTABLE, RATE_LIMITED, TEMPORARILY_UNAVAILABLE, INTERNAL_ERROR, TLS_REQUIRED. POST write scope, GET payments read scope, balance accounts read scope, admin payments admin scope."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "paths": {
    "/api/v1/payments": {
      "post": {
        "description": "Synchronous committed transfer. Same ID and canonical payload returns original result; changed payload returns 409. Scope payments:write. Maximum request 64 KiB.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Payment"
              },
              "example": {
                "paymentId": "d92192df-f79a-4553-8120-5660d2eb1294",
                "fromAccount": "ACC-1001",
                "toAccount": "ACC-2002",
                "amount": "125.750",
                "date": "2026-10-28T13:30:00+03:00",
                "purpose": "Invoice payment INV-2048",
                "notes": "October services"
              }
            },
            "application/xml": {
              "schema": {
                "$ref": "#/components/schemas/Payment"
              },
              "example": "<payment><paymentId>d92192df-f79a-4553-8120-5660d2eb1294</paymentId><fromAccount>ACC-1001</fromAccount><toAccount>ACC-2002</toAccount><amount>125.750</amount><date>2026-10-28T13:30:00+03:00</date><purpose>Invoice payment INV-2048</purpose><notes>October services</notes></payment>"
            }
          }
        },
        "responses": {
          "201": {
            "description": "First completed transfer",
            "headers": {
              "Location": {
                "schema": {
                  "type": "string"
                }
              },
              "X-Correlation-ID": {
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Receipt"
                }
              },
              "application/xml": {
                "schema": {
                  "$ref": "#/components/schemas/Receipt"
                }
              }
            }
          },
          "200": {
            "description": "Original completed result; idempotent replay",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Receipt"
                }
              },
              "application/xml": {
                "schema": {
                  "$ref": "#/components/schemas/Receipt"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/StandardError"
          },
          "401": {
            "$ref": "#/components/responses/StandardError"
          },
          "403": {
            "$ref": "#/components/responses/StandardError"
          },
          "404": {
            "$ref": "#/components/responses/StandardError"
          },
          "406": {
            "$ref": "#/components/responses/StandardError"
          },
          "409": {
            "$ref": "#/components/responses/StandardError"
          },
          "413": {
            "$ref": "#/components/responses/StandardError"
          },
          "415": {
            "$ref": "#/components/responses/StandardError"
          },
          "429": {
            "$ref": "#/components/responses/StandardError"
          },
          "500": {
            "$ref": "#/components/responses/StandardError"
          },
          "503": {
            "$ref": "#/components/responses/StandardError"
          }
        }
      }
    },
    "/api/v1/payments/{paymentId}": {
      "get": {
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "description": "Only the initiating principal may read stored completed or rejected outcome. Scope payments:read.",
        "parameters": [
          {
            "name": "paymentId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Stored authorized result",
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "$ref": "#/components/schemas/Receipt"
                    },
                    {
                      "$ref": "#/components/schemas/Error"
                    }
                  ]
                }
              },
              "application/xml": {
                "schema": {
                  "oneOf": [
                    {
                      "$ref": "#/components/schemas/Receipt"
                    },
                    {
                      "$ref": "#/components/schemas/Error"
                    }
                  ]
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/StandardError"
          },
          "401": {
            "$ref": "#/components/responses/StandardError"
          },
          "403": {
            "$ref": "#/components/responses/StandardError"
          },
          "404": {
            "$ref": "#/components/responses/StandardError"
          },
          "406": {
            "$ref": "#/components/responses/StandardError"
          },
          "409": {
            "$ref": "#/components/responses/StandardError"
          },
          "413": {
            "$ref": "#/components/responses/StandardError"
          },
          "415": {
            "$ref": "#/components/responses/StandardError"
          },
          "429": {
            "$ref": "#/components/responses/StandardError"
          },
          "500": {
            "$ref": "#/components/responses/StandardError"
          },
          "503": {
            "$ref": "#/components/responses/StandardError"
          }
        }
      }
    },
    "/api/v1/accounts/{accountId}/balance": {
      "get": {
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "description": "Owner or explicit view permission only. Scope accounts:read.",
        "parameters": [
          {
            "name": "accountId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Stored authorized result",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "accountId": {
                      "type": "string"
                    },
                    "balance": {
                      "type": "string",
                      "pattern": "^[0-9]+\\.[0-9]{3}$"
                    },
                    "currency": {
                      "const": "JOD"
                    }
                  }
                }
              },
              "application/xml": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "accountId": {
                      "type": "string"
                    },
                    "balance": {
                      "type": "string",
                      "pattern": "^[0-9]+\\.[0-9]{3}$"
                    },
                    "currency": {
                      "const": "JOD"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/StandardError"
          },
          "401": {
            "$ref": "#/components/responses/StandardError"
          },
          "403": {
            "$ref": "#/components/responses/StandardError"
          },
          "404": {
            "$ref": "#/components/responses/StandardError"
          },
          "406": {
            "$ref": "#/components/responses/StandardError"
          },
          "409": {
            "$ref": "#/components/responses/StandardError"
          },
          "413": {
            "$ref": "#/components/responses/StandardError"
          },
          "415": {
            "$ref": "#/components/responses/StandardError"
          },
          "429": {
            "$ref": "#/components/responses/StandardError"
          },
          "500": {
            "$ref": "#/components/responses/StandardError"
          },
          "503": {
            "$ref": "#/components/responses/StandardError"
          }
        }
      }
    },
    "/api/v1/admin/reconciliation": {
      "get": {
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "description": "Consistent read-only snapshot. Scope payments:admin.",
        "parameters": [],
        "responses": {
          "200": {
            "description": "Stored authorized result",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "balanced": {
                      "type": "boolean"
                    },
                    "paymentDiscrepancies": {
                      "type": "array",
                      "items": {
                        "type": "object"
                      }
                    },
                    "accountDiscrepancies": {
                      "type": "array",
                      "items": {
                        "type": "object"
                      }
                    },
                    "checkedAt": {
                      "type": "string",
                      "format": "date-time"
                    }
                  }
                }
              },
              "application/xml": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "balanced": {
                      "type": "boolean"
                    },
                    "paymentDiscrepancies": {
                      "type": "array",
                      "items": {
                        "type": "object"
                      }
                    },
                    "accountDiscrepancies": {
                      "type": "array",
                      "items": {
                        "type": "object"
                      }
                    },
                    "checkedAt": {
                      "type": "string",
                      "format": "date-time"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/StandardError"
          },
          "401": {
            "$ref": "#/components/responses/StandardError"
          },
          "403": {
            "$ref": "#/components/responses/StandardError"
          },
          "404": {
            "$ref": "#/components/responses/StandardError"
          },
          "406": {
            "$ref": "#/components/responses/StandardError"
          },
          "409": {
            "$ref": "#/components/responses/StandardError"
          },
          "413": {
            "$ref": "#/components/responses/StandardError"
          },
          "415": {
            "$ref": "#/components/responses/StandardError"
          },
          "429": {
            "$ref": "#/components/responses/StandardError"
          },
          "500": {
            "$ref": "#/components/responses/StandardError"
          },
          "503": {
            "$ref": "#/components/responses/StandardError"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "responses": {
      "StandardError": {
        "description": "Consistent safe error; 503/429 include Retry-After",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          },
          "application/xml": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      }
    },
    "schemas": {
      "Payment": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "paymentId",
          "fromAccount",
          "toAccount",
          "amount",
          "date",
          "purpose"
        ],
        "properties": {
          "paymentId": {
            "type": "string",
            "format": "uuid"
          },
          "fromAccount": {
            "type": "string",
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9_-]+$"
          },
          "toAccount": {
            "type": "string",
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9_-]+$"
          },
          "amount": {
            "oneOf": [
              {
                "type": "number",
                "exclusiveMinimum": 0,
                "maximum": 10000,
                "multipleOf": 0.001
              },
              {
                "type": "string",
                "pattern": "^[0-9]+(\\.[0-9]{1,3})?$"
              }
            ]
          },
          "date": {
            "type": "string",
            "format": "date-time"
          },
          "purpose": {
            "type": "string",
            "minLength": 1,
            "maxLength": 255
          },
          "notes": {
            "type": "string",
            "maxLength": 1000
          }
        },
        "xml": {
          "name": "payment"
        }
      },
      "Receipt": {
        "type": "object",
        "required": [
          "paymentId",
          "status",
          "fromAccount",
          "toAccount",
          "amount",
          "currency",
          "processedAt"
        ],
        "properties": {
          "paymentId": {
            "type": "string",
            "format": "uuid"
          },
          "fromAccount": {
            "type": "string",
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9_-]+$"
          },
          "toAccount": {
            "type": "string",
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9_-]+$"
          },
          "status": {
            "type": "string",
            "enum": [
              "COMPLETED"
            ]
          },
          "amount": {
            "type": "string",
            "pattern": "^[0-9]+\\.[0-9]{3}$"
          },
          "currency": {
            "type": "string",
            "enum": [
              "JOD"
            ]
          },
          "processedAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "xml": {
          "name": "receipt"
        }
      },
      "Error": {
        "type": "object",
        "required": [
          "status",
          "code",
          "message",
          "issues",
          "correlationId",
          "timestamp"
        ],
        "properties": {
          "paymentId": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "type": "string",
            "enum": [
              "ERROR",
              "REJECTED"
            ]
          },
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "issues": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "field",
                "code",
                "message"
              ],
              "properties": {
                "field": {
                  "type": "string"
                },
                "code": {
                  "type": "string"
                },
                "message": {
                  "type": "string"
                }
              }
            }
          },
          "correlationId": {
            "type": "string",
            "format": "uuid"
          },
          "timestamp": {
            "type": "string",
            "format": "date-time"
          }
        },
        "xml": {
          "name": "error"
        }
      }
    }
  }
}
