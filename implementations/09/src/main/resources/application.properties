spring.application.name=payments
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payments}
spring.datasource.username=${DB_USER:payments}
spring.datasource.password=${DB_PASSWORD:local-development-only}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '5s'
spring.flyway.enabled=true
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWKS_URI:http://localhost:8081/realms/payments/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:8081/realms/payments}
payments.audience=${OIDC_AUDIENCE:payments-api}
payments.max-amount=${MAX_PAYMENT_AMOUNT:10000.000}
payments.max-age-seconds=${MAX_AGE_SECONDS:2592000}
payments.future-seconds=${FUTURE_SECONDS:300}
payments.max-body=${MAX_BODY_BYTES:65536}
payments.rate-limit=${RATE_LIMIT:6000}
payments.require-tls=${REQUIRE_TLS:true}
server.max-http-request-header-size=16KB
server.tomcat.connection-timeout=5s
server.error.include-message=never
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.tracing.sampling.probability=${TRACE_SAMPLING:0.1}
logging.structured.format.console=logstash
payments.retention-days=${RETENTION_DAYS:2555}
logging.logback.rollingpolicy.max-history=${AUDIT_LOG_HISTORY:90}
logging.logback.rollingpolicy.max-file-size=100MB
