quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:payments}
quarkus.datasource.password=${DB_PASSWORD:local-only-password}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/payments}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.flyway.migrate-at-start=true
quarkus.http.limits.max-body-size=64K
quarkus.http.read-timeout=10S
quarkus.log.console.json=true
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
mp.jwt.verify.issuer=${JWT_ISSUER:https://identity.example.invalid}
mp.jwt.verify.audiences=${JWT_AUDIENCE:payments}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:https://identity.example.invalid/.well-known/jwks.json}
smallrye.jwt.verify.algorithm=RS256
quarkus.http.auth.proactive=false
payments.require-tls=true
%dev.payments.require-tls=false
%test.payments.require-tls=false
payments.max-amount=10000.000
payments.max-body-bytes=65536
payments.max-age-seconds=2592000
payments.future-seconds=300
payments.rate-per-minute=6000
payments.retention-days=2555
payments.failure-injection=false
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=5
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=10
