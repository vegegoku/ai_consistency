spring.application.name=payment-service
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payments}
spring.datasource.username=${DB_USER:payments}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.connection-init-sql=SET timezone TO 'UTC'
spring.jdbc.template.query-timeout=5
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.max-http-request-header-size=16KB
server.tomcat.connection-timeout=5s
server.tomcat.keep-alive-timeout=10s
server.tomcat.max-swallow-size=64KB
server.forward-headers-strategy=none
payments.require-tls=${REQUIRE_TLS:true}
payments.jwt.issuer=${JWT_ISSUER:http://localhost:8081/realms/payments}
payments.jwt.jwks-uri=${JWT_JWKS_URI:http://localhost:8081/realms/payments/protocol/openid-connect/certs}
payments.jwt.audience=${JWT_AUDIENCE:payment-service}
payments.maximum=${PAYMENT_MAXIMUM:10000.000}
payments.max-age=${PAYMENT_MAX_AGE:P30D}
payments.future-skew=${PAYMENT_FUTURE_SKEW:PT5M}
payments.max-body=${PAYMENT_MAX_BODY:65536}
payments.rate-per-second=${PAYMENT_RATE:150}
payments.trust-correlation-header=${TRUST_CORRELATION_HEADER:false}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.tracing.sampling.probability=${TRACE_SAMPLING:0.1}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=logstash
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=10
spring.datasource.hikari.data-source-properties.cancelSignalTimeout=2
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
