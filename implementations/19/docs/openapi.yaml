openapi: 3.0.3
info:
  title: JOD Payment Processing API
  version: 1.0.0
  description: Atomic internal JOD transfers. All examples require a fresh UUID and a timestamp within the configured window.
servers:
  - url: https://localhost:8443
security:
  - bearer: []
paths:
  /api/v1/payments:
    post:
      operationId: submitPayment
      description: Requires payments:write and source ownership or a debit grant. Idempotent canonical replay returns the recorded outcome.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Payment'}
            example: {paymentId: d92192df-f79a-4553-8120-5660d2eb1294, fromAccount: ACC-1001, toAccount: ACC-2002, amount: '125.750', date: '2026-10-28T13:30:00+03:00', purpose: Invoice INV-2048, notes: October services}
          application/xml:
            schema: {$ref: '#/components/schemas/Payment'}
            example: '<payment><paymentId>d92192df-f79a-4553-8120-5660d2eb1294</paymentId><fromAccount>ACC-1001</fromAccount><toAccount>ACC-2002</toAccount><amount>125.750</amount><date>2026-10-28T13:30:00+03:00</date><purpose>Invoice INV-2048</purpose></payment>'
      responses:
        '201':
          description: First committed transfer
          headers:
            Location: {schema: {type: string}}
            X-Correlation-ID: {schema: {type: string, format: uuid}}
          content:
            application/json: {schema: {$ref: '#/components/schemas/Receipt'}}
            application/xml: {schema: {$ref: '#/components/schemas/Receipt'}}
        '200':
          description: Identical replay of a completed payment
          content:
            application/json: {schema: {$ref: '#/components/schemas/Receipt'}}
            application/xml: {schema: {$ref: '#/components/schemas/Receipt'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/payments/{paymentId}:
    get:
      operationId: getPayment
      description: Requires payments:read. Unknown and unrelated records both return 404. Stored rejections return status REJECTED in a 200 response.
      parameters:
        - {name: paymentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Stored completed receipt or business rejection
          content:
            application/json: {schema: {oneOf: [{$ref: '#/components/schemas/Receipt'}, {$ref: '#/components/schemas/Error'}]}}
            application/xml: {schema: {oneOf: [{$ref: '#/components/schemas/Receipt'}, {$ref: '#/components/schemas/Error'}]}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/accounts/{accountId}/balance:
    get:
      operationId: getBalance
      description: Requires payments:read plus ownership or explicit can_view grant. Unknown and unrelated accounts both return 404.
      parameters:
        - {name: accountId, in: path, required: true, schema: {type: string, maxLength: 100}}
      responses:
        '200':
          description: Persisted available balance
          content:
            application/json: {schema: {$ref: '#/components/schemas/Balance'}}
            application/xml: {schema: {$ref: '#/components/schemas/Balance'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/operations/reconciliation:
    get:
      operationId: reconciliation
      description: Requires payments:admin. Read-only database invariant report.
      responses:
        '200':
          description: Reconciliation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  healthy: {type: boolean}
                  issues: {type: array, items: {type: object, additionalProperties: true}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    Payment:
      type: object
      additionalProperties: false
      xml: {name: payment}
      required: [paymentId, fromAccount, toAccount, amount, date, purpose]
      properties:
        paymentId: {type: string, format: uuid, description: Canonical lowercase hyphenated UUID}
        fromAccount: {type: string, minLength: 1, maxLength: 100}
        toAccount: {type: string, minLength: 1, maxLength: 100}
        amount:
          oneOf:
            - {type: string, pattern: '^[0-9]+(\.[0-9]{1,3})?$'}
            - {type: number, minimum: 0.001, maximum: 10000, multipleOf: 0.001}
        date: {type: string, format: date-time, description: Offset required; default max age 30 days and future skew 5 minutes}
        purpose: {type: string, minLength: 1, maxLength: 255}
        notes: {type: string, maxLength: 1000, nullable: true}
    Receipt:
      type: object
      xml: {name: response}
      required: [paymentId, status, fromAccount, toAccount, amount, currency, processedAt]
      properties:
        paymentId: {type: string, format: uuid}
        status: {type: string, enum: [COMPLETED]}
        fromAccount: {type: string}
        toAccount: {type: string}
        amount: {type: string, pattern: '^[0-9]+\.[0-9]{3}$', example: '125.750'}
        currency: {type: string, enum: [JOD]}
        processedAt: {type: string, format: date-time}
    Balance:
      type: object
      xml: {name: response}
      properties:
        accountId: {type: string}
        balance: {type: string, example: '374.250'}
        currency: {type: string, enum: [JOD]}
    Error:
      type: object
      xml: {name: response}
      required: [status, code, message, issues]
      properties:
        paymentId: {type: string, format: uuid}
        status: {type: string, enum: [REJECTED, ERROR]}
        code: {type: string}
        message: {type: string}
        issues:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              code: {type: string}
              message: {type: string}
        correlationId: {type: string, format: uuid}
        timestamp: {type: string, format: date-time}
  responses:
    BadRequest:
      description: MALFORMED_MESSAGE or VALIDATION_FAILED; no funds moved
      content: &errorContent
        application/json: {schema: {$ref: '#/components/schemas/Error'}}
        application/xml: {schema: {$ref: '#/components/schemas/Error'}}
    Unauthenticated: {description: UNAUTHENTICATED, content: *errorContent}
    Forbidden: {description: FORBIDDEN or TLS_REQUIRED, content: *errorContent}
    NotFound: {description: ACCOUNT_NOT_FOUND or PAYMENT_NOT_FOUND; existence concealed for unrelated callers, content: *errorContent}
    NotAcceptable: {description: NOT_ACCEPTABLE; response defaults to JSON for unsupported Accept, content: *errorContent}
    Conflict: {description: ACCOUNT_NOT_ACTIVE or INSUFFICIENT_FUNDS or IDEMPOTENCY_CONFLICT or PAYMENT_LIMIT_EXCEEDED, content: *errorContent}
    TooLarge: {description: MESSAGE_TOO_LARGE, content: *errorContent}
    UnsupportedMedia: {description: UNSUPPORTED_MEDIA_TYPE, content: *errorContent}
    RateLimited:
      description: RATE_LIMITED
      headers: {Retry-After: {schema: {type: integer}, description: Seconds until retry}}
      content: *errorContent
    Internal: {description: INTERNAL_ERROR; query or retry original payment ID if commit uncertain, content: *errorContent}
    Unavailable:
      description: TEMPORARILY_UNAVAILABLE; query or retry with same payment ID
      headers: {Retry-After: {schema: {type: integer}, description: Seconds until retry}}
      content: *errorContent
