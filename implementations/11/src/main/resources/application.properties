spring.application.name=payment-service
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payments}
spring.datasource.username=${DB_USER:payments}
spring.datasource.password=${DB_PASSWORD:local-development-only}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties.socketTimeout=10
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.flyway.locations=classpath:db/migration
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.connection-timeout=5s
server.tomcat.max-http-form-post-size=65536
server.tomcat.max-swallow-size=65536
server.max-http-request-header-size=16KB
security.issuer=${OIDC_ISSUER:http://localhost:8081/realms/payments}
security.jwk-set-uri=${OIDC_JWKS:http://localhost:8081/realms/payments/protocol/openid-connect/certs}
security.audience=${OIDC_AUDIENCE:payment-service}
payment.require-tls=${REQUIRE_TLS:true}
payment.trust-correlation-header=${TRUST_CORRELATION_HEADER:false}
payment.max-body-bytes=${MAX_BODY_BYTES:65536}
payment.max-amount=${MAX_PAYMENT_AMOUNT:10000.000}
payment.max-future-seconds=${MAX_FUTURE_SECONDS:300}
payment.max-age-seconds=${MAX_AGE_SECONDS:2592000}
payment.rate-per-minute=${RATE_PER_MINUTE:120}
payment.audit-retention-days=${AUDIT_RETENTION_DAYS:2555}
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.1}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
spring.threads.virtual.enabled=true
logging.structured.format.console=logstash
spring.flyway.user=${MIGRATION_USER:${spring.datasource.username}}
spring.flyway.password=${MIGRATION_PASSWORD:${spring.datasource.password}}
spring.flyway.enabled=${MIGRATIONS_ENABLED:true}

spring.jdbc.template.query-timeout=5s
