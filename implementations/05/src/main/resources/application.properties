quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:payments}
quarkus.datasource.password=${DB_PASSWORD:payments-local-only}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5435/payments}
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5435/payments}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=30
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=5
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=15
quarkus.flyway.migrate-at-start=true
quarkus.http.limits.max-body-size=64K
quarkus.http.limits.max-header-size=16K
quarkus.transaction-manager.default-transaction-timeout=15S
quarkus.http.auth.proactive=false
quarkus.http.insecure-requests=disabled
%dev.quarkus.http.insecure-requests=enabled
%test.quarkus.http.insecure-requests=enabled
mp.jwt.verify.issuer=${JWT_ISSUER:https://identity.example.invalid}
mp.jwt.verify.audiences=${JWT_AUDIENCE:payment-service}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:https://identity.example.invalid/.well-known/jwks.json}
quarkus.smallrye-jwt.enabled=true
quarkus.log.console.json=true
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_ENDPOINT:http://localhost:4317}
%test.quarkus.otel.sdk.disabled=true
payments.maximum=${PAYMENT_MAXIMUM:10000.000}
payments.max-future-seconds=${PAYMENT_MAX_FUTURE_SECONDS:300}
payments.max-age-seconds=${PAYMENT_MAX_AGE_SECONDS:2592000}
payments.body-limit=${PAYMENT_BODY_LIMIT:65536}
payments.rate-limit=${PAYMENT_RATE_LIMIT:600}
payments.retention-days=${PAYMENT_RETENTION_DAYS:2555}
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine
%test.quarkus.datasource.devservices.reuse=false
%test.quarkus.log.console.json=false
mp.jwt.verify.clock.skew=0
mp.jwt.verify.publickey.algorithm=RS256
%test.mp.jwt.verify.publickey.location=test-public.pem
%test.mp.jwt.verify.issuer=https://test.payment.invalid
%test.quarkus.http.test-port=0
