  "components": {
    "securitySchemes": {
      "bearerJwt": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "PaymentInstruction": {
        "type": "object",
        "additionalProperties": false,
        "xml": {
          "name": "payment"
        },
        "required": [
          "paymentId",
          "fromAccount",
          "toAccount",
          "amount",
          "date",
          "purpose"
        ],
        "properties": {
          "paymentId": {
            "type": "string",
            "format": "uuid"
          },
          "fromAccount": {
            "type": "string"
          },
          "toAccount": {
            "type": "string"
          },
          "amount": {
            "oneOf": [
              {
                "type": "string",
                "pattern": "^[0-9]+(\\.[0-9]{1,3})?$"
              },
              {
                "type": "number",
                "exclusiveMinimum": true,
                "minimum": 0,
                "maximum": 10000,
                "multipleOf": 0.001
              }
            ]
          },
          "date": {
            "type": "string",
            "format": "date-time"
          },
          "purpose": {
            "type": "string",
            "maxLength": 255
          },
          "notes": {
            "type": "string",
            "maxLength": 1000
          }
        }
      },
      "Receipt": {
        "type": "object",
        "properties": {
          "paymentId": {
            "type": "string"
          },
          "status": {
            "type": "string"
          },
          "fromAccount": {
            "type": "string"
          },
          "toAccount": {
            "type": "string"
          },
          "amount": {
            "type": "string"
          },
          "currency": {
            "type": "string"
          },
          "processedAt": {
            "type": "string"
          }
        },
        "example": {
          "paymentId": "d92192df-f79a-4553-8120-5660d2eb1294",
          "status": "COMPLETED",
          "fromAccount": "ACC-1001",
          "toAccount": "ACC-2002",
