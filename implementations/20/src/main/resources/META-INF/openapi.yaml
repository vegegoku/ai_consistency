components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Payment:
      type: object
      additionalProperties: false
      required:
      - paymentId
      - fromAccount
      - toAccount
      - amount
      - date
      - purpose
      properties:
        paymentId:
          type: string
          format: uuid
        fromAccount:
          type: string
          maxLength: 100
        toAccount:
          type: string
          maxLength: 100
        amount:
          oneOf:
          - type: string
            pattern: ^[0-9]+(\.[0-9]{1,3})?$
          - type: number
            exclusiveMinimum: true
            minimum: 0
            maximum: 10000
        date:
          type: string
          format: date-time
        purpose:
          type: string
          maxLength: 255
        notes:
          type: string
          maxLength: 1000
      xml:
        name: payment
    Receipt:
      type: object
      required:
      - paymentId
      - status
      - fromAccount
      - toAccount
      - amount
      - currency
      - processedAt
      properties:
        paymentId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - COMPLETED
        fromAccount:
          type: string
        toAccount:
          type: string
        amount:
          type: string
          example: '125.750'
        currency:
          type: string
          enum:
          - JOD
        processedAt:
          type: string
          format: date-time
      xml:
        name: response
    Error:
      type: object
      required:
      - status
      - code
      - message
      - issues
      - correlationId
      - timestamp
      properties:
        paymentId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - ERROR
          - REJECTED
        code:
          type: string
        message:
          type: string
        issues:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
        correlationId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
      xml:
        name: response
    StoredResult:
      oneOf:
      - $ref: '#/components/schemas/Receipt'
      - $ref: '#/components/schemas/Error'
    Balance:
      type: object
      properties:
        accountId:
          type: string
        availableBalance:
          type: string
          example: '374.250'
        currency:
          type: string
          enum:
          - JOD
    Reconciliation:
      type: object
      properties:
        issues:
          type: array
          items:
            type: object
