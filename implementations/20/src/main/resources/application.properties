quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:payments}
quarkus.datasource.password=${DB_PASSWORD:local-development-only}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/payments}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=5
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=10
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.http.limits.max-body-size=${PAYMENT_BODY_LIMIT:65536}
payments.body-limit=${PAYMENT_BODY_LIMIT:65536}
quarkus.http.insecure-requests=disabled
%dev.quarkus.http.insecure-requests=enabled
%test.quarkus.http.insecure-requests=enabled
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY:publicKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:https://issuer.example.test}
mp.jwt.verify.audiences=${JWT_AUDIENCE:payments-api}
quarkus.log.console.json=true
quarkus.otel.sdk.disabled=${OTEL_DISABLED:true}
quarkus.smallrye-openapi.info-title=Payment API
payments.maximum=${PAYMENT_MAXIMUM:10000.000}
payments.future-seconds=${PAYMENT_FUTURE_SECONDS:300}
payments.old-seconds=${PAYMENT_OLD_SECONDS:2592000}
payments.rate-per-minute=${PAYMENT_RATE_PER_MINUTE:600}
payments.retention-days=${PAYMENT_RETENTION_DAYS:2555}
%dev.payments.seed-demo=true

quarkus.http.auth.proactive=false
