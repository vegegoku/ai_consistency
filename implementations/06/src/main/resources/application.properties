quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:payments}
quarkus.datasource.password=${DB_PASSWORD:payments-local}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/payments}
quarkus.datasource.jdbc.max-size=24
quarkus.datasource.jdbc.acquisition-timeout=3S
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=3
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=10
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
%dev.quarkus.flyway.locations=db/migration,db/dev
%test.quarkus.flyway.locations=db/migration,db/dev
quarkus.http.limits.max-body-size=64K
quarkus.http.idle-timeout=30S
quarkus.http.read-timeout=10S
payment.body-limit=${PAYMENT_BODY_LIMIT:65536}
payment.maximum=${PAYMENT_MAXIMUM:10000.000}
payment.max-age-seconds=${PAYMENT_MAX_AGE_SECONDS:2592000}
payment.future-seconds=${PAYMENT_FUTURE_SECONDS:300}
payment.requests-per-minute=${PAYMENT_REQUESTS_PER_MINUTE:600}
payment.require-https=true
%dev.payment.require-https=false
%test.payment.require-https=false
%test.payment.requests-per-minute=100000
mp.jwt.verify.publickey.location=${JWT_JWKS_URL:http://localhost:8180/realms/payments/protocol/openid-connect/certs}
mp.jwt.verify.issuer=${JWT_ISSUER:http://localhost:8180/realms/payments}
mp.jwt.verify.audiences=payment-api
mp.jwt.verify.clock.skew=0
quarkus.http.auth.proactive=true
quarkus.log.console.json=true
%dev.quarkus.log.console.json=false
%test.quarkus.log.console.json=false
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_ENDPOINT:http://localhost:4317}
%test.quarkus.otel.sdk.disabled=true
%dev.quarkus.otel.sdk.disabled=true
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.http.test-port=0
%test.mp.jwt.verify.publickey.location=test-public.pem
%test.mp.jwt.verify.issuer=https://issuer.test
mp.openapi.scan.disable=true
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine
%test.quarkus.datasource.devservices.reuse=false
