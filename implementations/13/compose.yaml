name: payment-implementation-13
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: local-only-payments
    ports:
      - "127.0.0.1:54313:5432"
    volumes:
      - payment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 3s
      timeout: 2s
      retries: 20
  service:
    profiles: ["service"]
    build: .
    environment:
      QUARKUS_PROFILE: local
      DB_URL: jdbc:postgresql://db:5432/payments
      DB_USERNAME: payments
      DB_PASSWORD: local-only-payments
    ports:
      - "127.0.0.1:18013:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  payment-data:
