quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:payments}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/payments}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=30
quarkus.datasource.jdbc.acquisition-timeout=3S
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=3
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=10
quarkus.datasource.jdbc.additional-jdbc-properties.options=-c statement_timeout=5000 -c lock_timeout=2000
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.http.auth.proactive=false
quarkus.http.limits.max-body-size=${PAYMENT_MAX_BODY_BYTES:65536}
quarkus.http.idle-timeout=30S
quarkus.http.read-timeout=10S
%prod.quarkus.http.insecure-requests=disabled
quarkus.http.ssl.certificate.files=${TLS_CERT_FILE:}
quarkus.http.ssl.certificate.key-files=${TLS_KEY_FILE:}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:local-public.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:https://identity.example.invalid}
mp.jwt.verify.audiences=${JWT_AUDIENCE:payment-service}
mp.jwt.verify.publickey.algorithm=RS256
smallrye.jwt.required.claims=sub,exp,iat,scope
smallrye.jwt.time-to-live=3600
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:missing-production-key.pem}
%dev.mp.jwt.verify.issuer=local-payments
%test.mp.jwt.verify.issuer=local-payments
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.http.ssl.certificate.files=
%test.quarkus.http.ssl.certificate.key-files=
quarkus.log.console.json=true
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true
payment.max-amount=${PAYMENT_MAX_AMOUNT:10000.000}
payment.max-future-seconds=${PAYMENT_MAX_FUTURE_SECONDS:300}
payment.max-age-seconds=${PAYMENT_MAX_AGE_SECONDS:2592000}
payment.max-body-bytes=${PAYMENT_MAX_BODY_BYTES:65536}
payment.rate-limit-per-minute=${PAYMENT_RATE_LIMIT_PER_MINUTE:6000}
%dev.payment.seed.enabled=true
%local.payment.seed.enabled=true
%local.mp.jwt.verify.issuer=local-payments
%local.quarkus.otel.sdk.disabled=true
# Financial retention is indefinite in the application. External archival policy may extend it.
payment.retention.minimum-years=${PAYMENT_RETENTION_MINIMUM_YEARS:7}
payment.audit-log-retention-days=${PAYMENT_AUDIT_LOG_RETENTION_DAYS:90}
mp.openapi.scan.disable=true
# Bounded pre-routing body aggregation uses HTTP/1.1; disable h2c/HTTP2 stream re-read incompatibility.
quarkus.http.http2=false
