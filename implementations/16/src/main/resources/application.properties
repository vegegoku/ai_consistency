spring.application.name=payment-service
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payments?connectTimeout=3&socketTimeout=15}
spring.datasource.username=${DB_USER:payments}
spring.datasource.password=${DB_PASSWORD:payments-local-only}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${MIGRATION_USER:${spring.datasource.username}}
spring.flyway.password=${MIGRATION_PASSWORD:${spring.datasource.password}}
server.tomcat.connection-timeout=5s
server.tomcat.max-swallow-size=64KB
server.max-http-request-header-size=16KB
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
payments.jwt.issuer=${JWT_ISSUER:http://localhost:8081/realms/payments}
payments.jwt.jwk-set-uri=${JWT_JWKS_URI:http://localhost:8081/realms/payments/protocol/openid-connect/certs}
payments.jwt.audience=${JWT_AUDIENCE:payment-service}
payments.require-tls=${REQUIRE_TLS:true}
payments.max-body-bytes=${MAX_BODY_BYTES:65536}
payments.max-amount=${MAX_PAYMENT_AMOUNT:10000.000}
payments.max-age-seconds=${MAX_AGE_SECONDS:2592000}
payments.future-seconds=${FUTURE_SECONDS:300}
payments.rate-per-minute=${RATE_PER_MINUTE:600}
payments.lock-timeout-ms=${LOCK_TIMEOUT_MS:2000}
payments.statement-timeout-ms=${STATEMENT_TIMEOUT_MS:5000}
payments.db-retries=${DB_RETRIES:3}
payments.audit-retention-days=${AUDIT_RETENTION_DAYS:2555}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.tracing.sampling.probability=${TRACE_SAMPLE_RATE:0.1}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=ecs
logging.level.org.springframework.security=INFO
